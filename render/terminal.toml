app = "p99"
bin = "p99"
grid = [120, 34]
frame = "window"
typing = "45ms"

[build]
command = "cargo build --release --locked"
bin_dir = "{target}/release"

[env]
HOME = "home"

[theme]
name = "P99"
background = "#16161e"
foreground = "#c0caf5"
cursor = "#c0caf5"
selection = "#283457"
black = "#15161e"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"
brightBlack = "#414868"
brightRed = "#f7768e"
brightGreen = "#9ece6a"
brightYellow = "#e0af68"
brightBlue = "#7aa2f7"
brightMagenta = "#bb9af7"
brightCyan = "#7dcfff"
brightWhite = "#c0caf5"

[shots.inbox]
kind = "clip"
line = "The inbox on sample data: a filter, a thread opened, a reply, a status change and a switch to one host"
tape = "render/terminal/inbox.tape"
launch = "p99 tui --demo"
settle = "400ms"
closure = { crossfade = 0.5 }
