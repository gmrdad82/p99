app = "p99"
bin = "p99"
grid = [120, 34]
frame = "window"
typing = "45ms"

[build]
command = "cargo build --release --locked"
bin_dir = "{target}/release"

[env]
HOME = "home"

[theme]
name = "P99"
background = "#16161e"
foreground = "#c0caf5"
cursor = "#c0caf5"
selection = "#283457"
black = "#15161e"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"
brightBlack = "#414868"
brightRed = "#f7768e"
brightGreen = "#9ece6a"
brightYellow = "#e0af68"
brightBlue = "#7aa2f7"
brightMagenta = "#bb9af7"
brightCyan = "#7dcfff"
brightWhite = "#c0caf5"

[shots.inbox]
kind = "clip"
line = "The inbox on sample data: a filter, a thread opened, a reply, a status change and a switch to one host"
tape = "render/terminal/inbox.tape"
launch = "p99 tui --demo"
settle = "400ms"
closure = { crossfade = 0.5 }

[shots.setup]
kind = "clip"
line = "p99 setup on a mock Cloudflare account: the questions, the token check, D1, R2, the Worker, two hosts and the summary"
tape = "render/terminal/setup.tape"
launch = "mkdir -p shim && printf '#!/bin/sh\\nexit 1\\n' > shim/op && chmod +x shim/op && export PATH=\"$PWD/shim:$PATH\" HOME='~' P99_MOCK_PORT=$((20000 + RANDOM % 20000)) && export P99_CLOUDFLARE_API=http://127.0.0.1:$P99_MOCK_PORT/client/v4 P99_HOST_URL=http://127.0.0.1:$P99_MOCK_PORT/{host} && (node {app}/render/mock-cloudflare.mjs >/dev/null 2>&1 &) && clear"
settle = "800ms"
poster = "before-closure"

[shots.list-json]
kind = "still"
line = "p99 list --json on sample data: items across example.com and shop.example.com, as agents and scripts read them"
tape = "render/terminal/list-json.tape"
launch = "clear"
settle = "300ms"

[shots.thread]
kind = "still"
line = "A thread in the TUI: an item with comments, an agent's reply and its landings in dev and production"
tape = "render/terminal/thread.tape"
launch = "p99 tui --demo"
settle = "400ms"

[shots.codes]
kind = "still"
line = "The codes screen: who can file on which hosts, active and revoked"
tape = "render/terminal/codes.tape"
launch = "p99 tui --demo"
settle = "400ms"
