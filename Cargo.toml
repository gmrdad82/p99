[package]
name = "p99"
version = "1.1.4"
authors = ["Gamer Dad"]
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Issue and feedback reporting for any website, on Cloudflare: a lazy vanilla loader, a Worker, and a CLI and TUI inbox"
repository = "https://github.com/gmrdad82/p99"
homepage = "https://pitomd.com"
publish = false

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
hmac = "0.12"
pito-tui = { git = "https://github.com/gmrdad82/pito-tui", tag = "v0.4.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
unicode-normalization = "0.1"
ureq = { version = "3", features = ["json"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false
