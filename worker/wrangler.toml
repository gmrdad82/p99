name = "p99"
main = "src/worker.js"
compatibility_date = "2026-09-15"
workers_dev = false
preview_urls = false

[[rules]]
type = "Text"
globs = ["**/web/*.js", "**/web/*.css", "**/web/*.svg"]
fallthrough = false

[[d1_databases]]
binding = "DB"
database_name = "p99"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "p99"

[[durable_objects.bindings]]
name = "HUB"
class_name = "P99Hub"

[[migrations]]
tag = "p99-hub-1"
new_sqlite_classes = ["P99Hub"]

[[ratelimits]]
name = "RATE"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[vars]
VERSION = "dev"

[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true

[dev]
port = 8790
